<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>

		<title>Cloudflare AI Chat</title>

		<style>
			:root {
				--primary-color: #f6821f;
				--primary-hover: #e67e22;

				--bg-color: #f5f7fb;
				--chat-bg: #ffffff;

				--border-color: #e5e7eb;

				--text-color: #111827;
				--light-text: #6b7280;

				--user-bg: #f6821f;
				--assistant-bg: #f3f4f6;

				--shadow:
					0 4px 10px rgba(0, 0, 0, 0.05);
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					Inter,
					Segoe UI,
					sans-serif;

				background: var(--bg-color);

				height: 100vh;

				display: flex;
				flex-direction: column;

				color: var(--text-color);
			}

			/* ================= HEADER ================= */

			header {
				background: white;

				padding: 16px 20px;

				border-bottom: 1px solid
					var(--border-color);

				display: flex;
				align-items: center;
				justify-content: space-between;

				box-shadow: var(--shadow);
			}

			header h1 {
				font-size: 1.3rem;
				color: var(--primary-color);
			}

			header p {
				font-size: 0.9rem;
				color: var(--light-text);
			}

			.header-left {
				display: flex;
				flex-direction: column;
			}

			.clear-btn {
				background: #ef4444;
				color: white;

				border: none;

				padding: 10px 14px;

				border-radius: 6px;

				cursor: pointer;

				font-size: 0.9rem;
			}

			.clear-btn:hover {
				background: #dc2626;
			}

			/* ================= CHAT CONTAINER ================= */

			.chat-container {
				flex: 1;

				max-width: 900px;
				width: 100%;

				margin: 20px auto;

				display: flex;
				flex-direction: column;

				background: var(--chat-bg);

				border-radius: 14px;

				overflow: hidden;

				box-shadow: var(--shadow);
			}

			/* ================= MESSAGES ================= */

			.chat-messages {
				flex: 1;

				padding: 20px;

				overflow-y: auto;

				background: #fafafa;
			}

			.message {
				max-width: 80%;

				padding: 14px 16px;

				margin-bottom: 16px;

				border-radius: 14px;

				word-wrap: break-word;

				line-height: 1.6;

				animation: fadeIn 0.2s ease;
			}

			.user {
				margin-left: auto;

				background: var(--user-bg);

				color: white;

				border-bottom-right-radius: 4px;
			}

			.assistant {
				margin-right: auto;

				background: var(--assistant-bg);

				color: var(--text-color);

				border-bottom-left-radius: 4px;
			}

			/* ================= LINKS ================= */

			.message a {
				color: #2563eb;

				text-decoration: underline;

				word-break: break-all;
			}

			.user a {
				color: #ffffff;
			}

			/* ================= TYPING ================= */

			.typing-indicator {
				display: none;

				padding: 10px 20px;

				font-size: 0.9rem;

				color: var(--light-text);

				background: white;

				border-top: 1px solid
					var(--border-color);
			}

			/* ================= INPUT ================= */

			.message-input {
				display: flex;

				align-items: flex-end;

				padding: 16px;

				background: white;

				border-top: 1px solid
					var(--border-color);

				gap: 10px;
			}

			#user-input {
				flex: 1;

				padding: 14px;

				border: 1px solid
					var(--border-color);

				border-radius: 10px;

				font-size: 1rem;

				font-family: inherit;

				resize: none;

				outline: none;

				max-height: 160px;

				overflow-y: auto;
			}

			#user-input:focus {
				border-color: var(--primary-color);
			}

			#send-button {
				background: var(--primary-color);

				color: white;

				border: none;

				padding: 14px 18px;

				border-radius: 10px;

				cursor: pointer;

				font-size: 1rem;

				transition: 0.2s;
			}

			#send-button:hover {
				background: var(--primary-hover);
			}

			#send-button:disabled {
				background: gray;
				cursor: not-allowed;
			}

			/* ================= FOOTER ================= */

			footer {
				text-align: center;

				padding: 10px;

				font-size: 0.85rem;

				color: var(--light-text);
			}

			/* ================= ANIMATION ================= */

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(10px);
				}

				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* ================= MOBILE ================= */

			@media (max-width: 768px) {
				.chat-container {
					margin: 0;
					border-radius: 0;
					height: 100vh;
				}

				.message {
					max-width: 92%;
				}

				header {
					padding: 12px;
				}
			}
		</style>
	</head>

	<body>
		<header>
			<div class="header-left">
				<h1>Cloudflare AI Chat</h1>
				<p>Powered by Cloudflare Workers AI</p>
			</div>

			<button
				class="clear-btn"
				onclick="clearChatHistory()"
			>
				Clear Chat
			</button>
		</header>

		<div class="chat-container">
			<!-- Messages -->
			<div
				id="chat-messages"
				class="chat-messages"
			></div>

			<!-- Typing -->
			<div
				class="typing-indicator"
				id="typing-indicator"
			>
				🤖 AI is thinking...
			</div>

			<!-- Input -->
			<div class="message-input">
				<textarea
					id="user-input"
					placeholder="Type your message..."
					rows="1"
				></textarea>

				<button id="send-button">
					Send
				</button>
			</div>
		</div>

		<footer>
			Cloudflare Workers AI Chat © 2026
		</footer>

		<!-- Chat Script -->
		<script src="chat.js"></script>
	</body>
</html>
